<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1a"/>
      <stop offset="0.55" stop-color="#09090b"/>
      <stop offset="1" stop-color="#170f2e"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.5" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle grid -->
  <g stroke="#8b5cf6" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 120 H1200 M0 255 H1200 M0 390 H1200 M0 525 H1200"/>
    <path d="M200 0 V630 M420 0 V630 M640 0 V630 M860 0 V630 M1080 0 V630"/>
  </g>

  <!-- corner accents -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#mark)"/>

  <!-- AETHER mark, left -->
  <g transform="translate(80 105) scale(4.6)">
    <path d="M32 4 L56 18 L56 46 L32 60 L8 46 L8 18 Z" stroke="url(#mark)" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
    <g stroke="url(#mark)" stroke-width="1.4" opacity="0.55">
      <ellipse cx="32" cy="32" rx="21" ry="7.5"/>
      <ellipse cx="32" cy="32" rx="21" ry="7.5" transform="rotate(60 32 32)"/>
      <ellipse cx="32" cy="32" rx="21" ry="7.5" transform="rotate(120 32 32)"/>
    </g>
    <circle cx="53" cy="32" r="2.1" fill="#22d3ee"/>
    <circle cx="20" cy="40.5" r="2.1" fill="#8b5cf6"/>
    <circle cx="38" cy="23.5" r="2.1" fill="#67e8f9"/>
    <path d="M32 22 L40 26.5 L40 35.5 L32 40 L24 35.5 L24 26.5 Z" fill="url(#core)"/>
  </g>

  <!-- wordmark -->
  <text x="430" y="330" font-family="'Space Grotesk','Arial Black',sans-serif" font-size="120" font-weight="800" letter-spacing="8" fill="#f5f7fa">AETHER</text>
  <text x="432" y="392" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="600" letter-spacing="1" fill="url(#mark)">The 100x Open-Source AI Harness</text>

  <!-- stat chips -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="26" font-weight="600">
    <g transform="translate(432 448)">
      <rect width="188" height="60" rx="12" fill="#0e1119" stroke="#263041"/>
      <text x="94" y="39" text-anchor="middle" fill="#22d3ee">117 AGENTS</text>
    </g>
    <g transform="translate(640 448)">
      <rect width="196" height="60" rx="12" fill="#0e1119" stroke="#263041"/>
      <text x="98" y="39" text-anchor="middle" fill="#8b5cf6">540 SKILLS</text>
    </g>
    <g transform="translate(856 448)">
      <rect width="196" height="60" rx="12" fill="#0e1119" stroke="#263041"/>
      <text x="98" y="39" text-anchor="middle" fill="#10b981">54 WORKFLOWS</text>
    </g>
  </g>

  <!-- footer line -->
  <text x="432" y="560" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#7a839a">github.com/Tabrej96/AETHER  ·  Apache-2.0  ·  Open Source</text>
</svg>
