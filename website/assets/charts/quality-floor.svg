<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" font-family="Segoe UI, Arial, sans-serif">
<text x="12" y="24" font-size="16" font-weight="700" fill="#1a2332">Catalog quality floor — measured, machine-enforced</text>
<text x="12" y="44" font-size="12" fill="#5a6b82">Score out of 100 from the deterministic scorer · the gate re-measures this on every release run</text>
