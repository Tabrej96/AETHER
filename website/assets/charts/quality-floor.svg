<text x="20" y="104" font-size="12" fill="#5a6b82">before gate</text>
<rect x="130" y="92" width="230" height="18" rx="3" fill="#c3ccd8"/>
<text x="368" y="106" font-size="12" fill="#c3ccd8">floor 72</text>
<text x="20" y="134" font-size="12" fill="#5a6b82">after gate</text>
<rect x="130" y="122" width="320" height="18" rx="3" fill="#0f7d3b"/>
<text x="458" y="136" font-size="12" font-weight="700" fill="#0f7d3b">floor 100 (max)</text>
<text x="340" y="70" font-size="14" font-weight="700" fill="#1a2332">Skills (540 components)</text>
<text x="340" y="104" font-size="12" fill="#5a6b82">before gate</text>
<rect x="450" y="92" width="262" height="18" rx="3" fill="#c3ccd8"/>
