<text x="340" y="134" font-size="12" fill="#5a6b82">after gate</text>
<rect x="450" y="122" width="320" height="18" rx="3" fill="#0f7d3b"/>
<text x="778" y="136" font-size="12" font-weight="700" fill="#0f7d3b">floor 100 (max)</text>
<text x="20" y="180" font-size="12" fill="#0f7d3b" font-weight="600">Result: all 657 components now score 100/100 · a regression would fail the release pipeline</text>
</svg>